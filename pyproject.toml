[project]
name = "jarvis-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "elevenlabs>=2.44.0",
    "livekit-agents>=1.5.6",
    "livekit-plugins-deepgram>=1.5.6",
    "livekit-plugins-silero>=1.5.6",
    "matplotlib>=3.9.0",
    "numpy>=2.4.4",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pycaw>=20251023",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "pyperclip>=1.11.0",
    "PyQt5>=5.15.11",
    "pyqt5-qt5==5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=0.6.23",
    "pyttsx3>=2.99",
    "qtawesome>=1.4.2",
    "reportlab>=4.0.0",
    "screen-brightness-control>=0.22.0",
    "sounddevice>=0.5.5",
    "speechrecognition>=3.16.0",
    "vapi-server-sdk>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: tests that take more than a few seconds (deselect with -m 'not slow')",
    "integration: tests that hit external services (network, real subprocess, real browser)",
    "qt: tests that require a Qt application (auto-skipped on headless CI)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line-length handled by formatter
    "B008",  # default arg call — common Qt pattern
]

