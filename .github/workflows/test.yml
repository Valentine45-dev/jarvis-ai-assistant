name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # JARVIS is a Windows-targeted PyQt5 app (MCI audio, pycaw, powershell/
        # cmd exec paths) — windows-latest covers that platform; ubuntu covers
        # the cross-platform core on two Python versions.
        include:
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      # Headless PyQt5 + audio backends need a few system libs on LINUX only.
      # Windows ships the Qt platform plugins and a bundled PortAudio wheel, so
      # there's nothing to apt-get there.
      - name: System deps (Qt offscreen, libegl, libxkbcommon)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Sync dependencies
        run: uv sync --dev

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
          # Sentinel keys — every test that hits the Anthropic / ElevenLabs /
          # Gemini SDK is expected to use the `mock_anthropic` / `mock_*`
          # fixtures from conftest.py. These env vars only exist so
          # `config.load()` and module-level `_get_client()` calls don't fail
          # on a missing key. They are NOT real credentials.
          ANTHROPIC_API_KEY: test-key
          GEMINI_API_KEY: test-key
          ELEVENLABS_API_KEY: test-key
          OPENWEATHER_API_KEY: test-key
        # Deselect markers that can't run on headless CI with no API keys,
        # mic, or browser: `qt` (needs a display), `integration` (real
        # network/subprocess/browser), and `slow`. conftest.py also auto-skips
        # integration unless JARVIS_RUN_INTEGRATION=1 — the marker filter here
        # makes the contract explicit and covers qt/slow too.
        run: uv run pytest -q -m "not integration and not qt and not slow"

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev --no-install-project
      - name: ruff check
        run: uv run ruff check core/ ui/ tests/ config/
        continue-on-error: true
      - name: ruff format --check
        run: uv run ruff format --check core/ ui/ tests/ config/
        continue-on-error: true
